name: Verify game
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Save verified production build
        uses: actions/upload-artifact@v4
        with:
          name: production-web
          path: www
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
# Release the matching Functions, rules, and web build together after the
# owner completes docs/release-security-fixes.md. Hosting-only auto-deployment
# would leave the old database permissions or deploy an unusable V2 client.
